🎯 Project Overview
Dreamway Education is a professional education consultancy that helps students get admissions in foreign universities across 15+ countries. The website must look highly modern, professional, and completely different from typical Pakistani consultancy websites. It must feel premium, trustworthy, and visually world-class.

🎨 Brand Identity (Logo Colors)
The consultancy's logo uses three specific colors with defined proportions:
Role	Hex Code	Proportion	Usage
Primary	#23AAA6 (Teal)	60%	Main color — buttons, links, highlights, key elements
Secondary	#265D96 (Deep Blue)	30%	Secondary elements, gradients, icons, section accents
Tertiary/Accent	#C97E5E (Warm Terracotta)	<10%	Very sparingly — special badges, rare CTA highlights, subtle warm accents
Design guideline: Terracotta should barely appear. The dominant vibe is Teal + Deep Blue with generous white space and subtle grey tones.

🌐 References (What NOT to do exactly, but take inspiration)
iwiseeducation.com — Slightly better structured, but still looks dated and generic.
vibranteducational.com — Very basic, old-school design, poor typography.
Requirement: The new website must be several times more modern than both. These are only reference points for the type of content needed. The actual design should feel like a SaaS/fintech-level modern web app — not a typical local consultancy.

🚀 Tech Stack
React JS (via Vite, already set up)
Tailwind CSS v4 (already installed, configured via @theme in index.css)
Framer Motion (already installed for animations)
React Router v6 (for routing)
React Icons (for modern, clean icons)
Google Fonts: Inter (for clean, modern typography)

